<a
    class="store-link"
    href="$app_store_url"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Download $app_name on the App Store"
>
    <picture>
        <source srcset="https://toolbox.marketingtools.apple.com/api/v2/badges/download-on-the-app-store/white/en-us" media="(prefers-color-scheme: dark)" />
        <img class="store-badge" src="https://toolbox.marketingtools.apple.com/api/v2/badges/download-on-the-app-store/black/en-us" alt="Download on the App Store" />
    </picture>
</a>
